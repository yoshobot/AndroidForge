name: DramaHub Signed Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout AndroidForge repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find and extract latest DramaHub source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find input -maxdepth 2 -type f -iname '*.zip' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n1 | cut -d' ' -f2-)"
          if [[ -z "${ZIP_FILE:-}" ]]; then
            echo 'Tidak menemukan ZIP source di folder input/.' >&2
            exit 1
          fi
          echo "Source ZIP: $ZIP_FILE"
          mkdir -p "$RUNNER_TEMP/dramahub-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/dramahub-source"
          PROJECT_DIR="$(find "$RUNNER_TEMP/dramahub-source" -type f -name settings.gradle -print -quit | xargs -r dirname)"
          if [[ -z "${PROJECT_DIR:-}" || ! -f "$PROJECT_DIR/app/build.gradle" ]]; then
            echo 'Struktur source tidak valid: settings.gradle dan app/build.gradle harus berada pada project yang sama.' >&2
            find "$RUNNER_TEMP/dramahub-source" -maxdepth 5 -type f | head -100
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project root: $PROJECT_DIR"

      - name: Validate package and set a monotonic versionCode
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, pathlib, sys
          project = pathlib.Path(os.environ["PROJECT_DIR"])
          gradle = project / "app/build.gradle"
          text = gradle.read_text()
          if not re.search(r"applicationId\s+['\"]com\.dramahub\.app['\"]", text):
              print("ERROR: applicationId bukan com.dramahub.app; build dihentikan agar tidak membuat aplikasi berbeda.", file=sys.stderr)
              sys.exit(1)
          run_number = int(os.environ["RUN_NUMBER"])
          # Replace either `versionCode 6` or expressions such as `versionCode Math.max(...)`.
          updated, count = re.subn(
              r"(?m)^(\s*)versionCode\s+.*$",
              lambda m: f"{m.group(1)}versionCode {10000 + run_number}",
              text,
              count=1,
          )
          if count != 1:
              print("ERROR: baris versionCode tidak ditemukan di app/build.gradle.", file=sys.stderr)
              sys.exit(1)
          gradle.write_text(updated)
          print(f"applicationId=com.dramahub.app; versionCode={10000 + run_number}")
          PY

      - name: Decode and validate the original release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" || -z "${KEYSTORE_PASSWORD:-}" ]]; then
            echo 'Secret ANDROID_KEYSTORE_BASE64 atau ANDROID_KEYSTORE_PASSWORD belum diisi.' >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dramahub-release.jks"
          test -s "$RUNNER_TEMP/dramahub-release.jks"
          KEY_ALIAS="${KEY_ALIAS_SECRET:-dramahub}"
          KEY_PASSWORD="${KEY_PASSWORD_SECRET:-$KEYSTORE_PASSWORD}"
          echo "Menggunakan alias: $KEY_ALIAS"
          keytool -list -keystore "$RUNNER_TEMP/dramahub-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/dramahub-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          set -euo pipefail
          gradle --no-daemon -p "$PROJECT_DIR" assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Verify APK package, integrity, and signing certificate
        id: verify
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "${APK:-}" ]]; then
            echo 'APK release tidak ditemukan.' >&2
            exit 1
          fi
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.dramahub.app'" "$RUNNER_TEMP/badging.txt" || {
            echo 'ERROR: package APK bukan com.dramahub.app.' >&2
            exit 1
          }
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/cert.txt"
          CERT="$(sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/cert.txt" | head -n1 | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          EXPECTED="D657CB78B477A4A73B60FAD8BFDF46A82784B02634227C7BB2135CFDCCD01254"
          if [[ -z "$CERT" ]]; then
            echo 'ERROR: tidak dapat membaca fingerprint sertifikat APK.' >&2
            exit 1
          fi
          echo "APK certificate SHA-256 (normalized): $CERT"
          if [[ "$CERT" != "$EXPECTED" ]]; then
            echo 'ERROR: Sertifikat APK tidak cocok dengan fingerprint DramaHub lama yang tercatat. APK tidak akan diterbitkan sebagai artifact agar tidak berisiko.' >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/staged"
          cp "$APK" "$RUNNER_TEMP/staged/DramaHub-release-signed.apk"
          echo "APK valid: package com.dramahub.app dan sertifikat cocok."

      - name: Upload verified signed APK
        uses: actions/upload-artifact@v4
        with:
          name: DramaHub-signed-release
          path: ${{ runner.temp }}/staged/DramaHub-release-signed.apk
          if-no-files-found: error
          retention-days: 14
