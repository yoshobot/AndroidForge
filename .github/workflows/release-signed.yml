name: DramaHub Signed Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout AndroidForge repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          if [[ -z "${SDKMANAGER:-}" || ! -x "$SDKMANAGER" ]]; then
            echo 'sdkmanager tidak ditemukan pada runner.' >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find and extract latest DramaHub source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find input -maxdepth 2 -type f -iname '*.zip' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n1 | cut -d' ' -f2-)"
          if [[ -z "${ZIP_FILE:-}" ]]; then
            echo 'Tidak menemukan ZIP source di folder input/. Upload ZIP DramaHub ke input/ terlebih dahulu.' >&2
            exit 1
          fi
          echo "Source ZIP: $ZIP_FILE"
          mkdir -p "$RUNNER_TEMP/dramahub-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/dramahub-source"
          PROJECT_DIR="$(find "$RUNNER_TEMP/dramahub-source" -type f -name settings.gradle -print -quit | xargs -r dirname)"
          if [[ -z "${PROJECT_DIR:-}" ]] || [[ ! -f "$PROJECT_DIR/app/build.gradle" ]]; then
            echo 'Struktur ZIP tidak cocok: settings.gradle dan app/build.gradle tidak ditemukan bersama.' >&2
            find "$RUNNER_TEMP/dramahub-source" -maxdepth 4 -type f | head -80
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project root: $PROJECT_DIR"

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo 'Secret ANDROID_KEYSTORE_BASE64 belum diisi.' >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dramahub-release-v2.jks"
          test -s "$RUNNER_TEMP/dramahub-release-v2.jks"

      - name: Build signed release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_PASSWORD:-}" ]]; then
            echo 'Secret ANDROID_KEYSTORE_PASSWORD belum diisi.' >&2
            exit 1
          fi
          gradle --no-daemon -p "${{ steps.source.outputs.project_dir }}" assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/dramahub-release-v2.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=dramahub \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: DramaHub-signed-release
          path: ${{ steps.source.outputs.project_dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
