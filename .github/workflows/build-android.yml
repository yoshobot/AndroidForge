
      # Step 13: Sign APK and upload signed artifact
      - name: Sign APK with DramaHub keystore
        if: steps.collect.outputs.apk_count != '0' && steps.collect.outputs.apk_count != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64" || {
            echo "::error::ANDROID_KEYSTORE_BASE64 is missing"
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "::error::ANDROID_KEYSTORE_PASSWORD is missing"
            exit 1
          }

          KEYSTORE="$RUNNER_TEMP/dramahub-release-v2.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          test -x "$APKSIGNER" || {
            echo "::error::apksigner not found"
            exit 1
          }

          shopt -s nullglob
          APK_FILES=("$GITHUB_WORKSPACE/output"/*.apk)

          if [ ${#APK_FILES[@]} -eq 0 ]; then
            echo "::error::No APK files found in output directory"
            exit 1
          fi

          for APK in "${APK_FILES[@]}"; do
            TEMP_APK="${APK}.signed"

            "$APKSIGNER" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias dramahub \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEYSTORE_PASSWORD \
              --out "$TEMP_APK" \
              "$APK"

            "$APKSIGNER" verify --verbose "$TEMP_APK"
            mv "$TEMP_APK" "$APK"
            echo "Signed: $(basename "$APK")"
          done

          rm -f "$KEYSTORE"

      - name: Upload APK artifact
        if: steps.collect.outputs.apk_count != '0' && steps.collect.outputs.apk_count != ''
        uses: actions/upload-artifact@v4
        with:
          name: AndroidForge-APKs
          path: ${{ steps.collect.outputs.apk_directory }}/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
